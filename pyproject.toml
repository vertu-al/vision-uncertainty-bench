[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-uncertainty-bench"
version = "0.1.0"
description = "A reproducible benchmark for calibration and abstention under controlled image corruptions."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Verena Teresa"}
]
dependencies = [
  "contourpy>=1.2,<1.4",
  "matplotlib>=3.8",
  "numpy>=1.26,<2",
  "pandas>=2.2,<3",
  "pillow>=10.0",
  "torch>=2.2",
  "torchvision>=0.17"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]